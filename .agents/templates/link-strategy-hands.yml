name: Link Strategy Hands Guardian

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

defaults:
  run:
    shell: bash

jobs:
  verification-gate:
    name: verification-gate (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Smart Dependency Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ] && grep -qE '"(dependencies|devDependencies)":' package.json; then
            npm install
          fi

      - name: "[STRICT] Technical Verify Gate"
        run: node .agents/tools/ls-engine/cli.mjs verify-gate

      - name: "[STRICT] Enforce Delivery Receipt"
        run: node .agents/tools/ls-engine/cli.mjs verify-delivery

      - name: "Upload Gate Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            report/GATE_REPORT.md
            report/gate-manifest.json
            report/delivery-receipt.json
