name: Link Strategy Verification Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  verification-gate:
    name: verification-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Execute Technical Verify Gate
        run: npm run verify-gate -- --project-path .

      - name: Enforce Fresh Gate Integrity
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";

          const report = fs.readFileSync("GATE_REPORT.md", "utf8");
          const match = report.match(/Integrity-Hash:\s*([A-Fa-f0-9]{64})/);
          if (!match) {
            console.error("ERROR: Integrity-Hash not found in GATE_REPORT.md");
            process.exit(1);
          }

          const excludedFiles = new Set(["GATE_REPORT.md"]);
          const excludedDirs = new Set([".git", "node_modules", "dist", "build"]);
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              const rel = path.relative(".", full).split(path.sep).join("/");
              if (entry.isDirectory()) {
                if (!rel.split("/").some((part) => excludedDirs.has(part))) walk(full);
              } else if (entry.isFile() && !excludedFiles.has(rel)) {
                files.push(rel);
              }
            }
          }

          walk(".");
          const manifest = files.sort().map((rel) => {
            const fileHash = createHash("sha256").update(fs.readFileSync(rel)).digest("hex").toUpperCase();
            return `${rel}\t${fileHash}`;
          }).join("\n");
          const current = createHash("sha256").update(manifest).digest("hex").toUpperCase();
          const stored = match[1].toUpperCase();
          if (stored !== current) {
            console.error("CRITICAL ERROR: Code changed after Gate Report generation.");
            console.error(`Stored: ${stored}`);
            console.error(`Actual: ${current}`);
            process.exit(1);
          }
          console.log("Integrity Verified: Code matches freshly generated Gate Report.");
          NODE

      - name: Upload Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-${{ matrix.os }}
          path: GATE_REPORT.md
