name: Link Strategy CI Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

defaults:
  run:
    shell: bash

jobs:
  verification-gate:
    name: verification-gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Identify Repository Role
        id: identity
        run: |
          IDENTITY=$(npm run ls-identity --silent)
          echo "$IDENTITY"
          if echo "$IDENTITY" | grep -q "MASTER"; then
            echo "role=master" >> $GITHUB_OUTPUT
          elif echo "$IDENTITY" | grep -q "BRAIN"; then
            echo "role=brain" >> $GITHUB_OUTPUT
          elif echo "$IDENTITY" | grep -q "HANDS"; then
            echo "role=hands" >> $GITHUB_OUTPUT
          else
            echo "role=unknown" >> $GITHUB_OUTPUT
          fi

      # FLOW A: MASTER WORKSPACE
      - name: [MASTER] Execute System Self-Test
        if: steps.identity.outputs.role == 'master'
        run: npm run self-test

      # FLOW B: HANDS/SATELLITE WORKSPACE
      - name: [HANDS] Governance Path Protection
        if: steps.identity.outputs.role == 'hands' && !contains(github.event.head_commit.message, 'chore(sync):')
        run: |
          # Hard check using git diff to prevent any tampering with DNA files
          git fetch origin ${{ github.ref_name }} --depth=2
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          echo "Checking for unauthorized DNA changes..."
          if echo "$CHANGED_FILES" | grep -E '^(\.agents/|GEMINI\.md|\.LinkStrategy/)' > /dev/null; then
            echo "CRITICAL SECURITY ERROR: Unauthorized modification of governance assets detected."
            echo "Protected paths: .agents/, GEMINI.md, .LinkStrategy/"
            echo "Push blocked. Only 'chore(sync):' commits from Brain are allowed to touch these files."
            exit 1
          fi

      - name: [HANDS] Execute Technical Verify Gate
        if: steps.identity.outputs.role == 'hands'
        run: npm run verify-gate -- --project-path .

      - name: [HANDS] Enforce Fresh Gate Integrity
        if: steps.identity.outputs.role == 'hands'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          const report = fs.readFileSync("GATE_REPORT.md", "utf8");
          const match = report.match(/Integrity-Hash:\s*([A-Fa-f0-9]{64})/);
          if (!match) { process.exit(1); }
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              const rel = path.relative(".", full).split(path.sep).join("/");
              if (entry.isDirectory()) {
                if (![".git", "node_modules", "dist", "build"].some(d => rel.includes(d))) walk(full);
              } else if (entry.isFile() && rel !== "GATE_REPORT.md") {
                files.push(rel);
              }
            }
          }
          walk(".");
          const manifest = files.sort().map((rel) => {
            const fileHash = createHash("sha256").update(fs.readFileSync(rel)).digest("hex").toUpperCase();
            return `${rel}\t${fileHash}`;
          }).join("\n");
          const current = createHash("sha256").update(manifest).digest("hex").toUpperCase();
          if (match[1].toUpperCase() !== current) process.exit(1);
          NODE

      - name: [HANDS] Upload Gate Report
        if: steps.identity.outputs.role == 'hands' && always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report-${{ matrix.os }}
          path: GATE_REPORT.md

      # FLOW C: BRAIN WORKSPACE
      - name: [BRAIN] Execute Registry & Connectivity Audit
        if: steps.identity.outputs.role == 'brain'
        run: npm run verify-brain
