name: Governance Protection Gate

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  block-illegal-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject governance changes from Hands
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '^(\.agents/|GEMINI\.md|\.LinkStrategy/)' > /dev/null; then
            echo "ERROR: Unauthorized modification of governance assets detected."
            echo "Protected paths: .agents/, GEMINI.md, .LinkStrategy/"
            echo "These files can only be updated by Brain through approved sync workflows."
            exit 1
          fi

          echo "No protected governance files changed."
